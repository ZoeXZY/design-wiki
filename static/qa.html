<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>检索问答 · 设计规范活知识库</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/flow.css"><script defer src="/qa.js"></script></head><body><main class="flow-shell">
<header class="flow-header"><nav><a href="/">返回知识库</a><a href="/workflow.html">审核与发布</a><a href="/experience.html">课堂轻量体验</a></nav><span>Design Wiki · Open source</span></header>
<h1 class="flow-title">带着来源回答，依据变化后再复核</h1><p class="flow-lead">从公开规范和当前本地规则中检索证据，再调用真实模型生成回答。每次保留问题、证据、参数、用量和原始答案。</p><p id="config" class="flow-notice">正在读取模型与知识库配置。</p><p id="error" class="flow-error" role="alert"></p>
<div class="flow-grid"><section class="panel"><h2>提问与检索范围</h2><label class="field">示例问题<select id="example"><option value="wcag">WCAG目标尺寸</option><option value="compare">比较两套按钮指导</option><option value="history">追查变更日期</option><option value="local">检查当前本地规则</option></select></label><label class="field">问题<textarea id="question" aria-label="问题"></textarea></label><fieldset style="border:0;padding:0"><legend>资料来源</legend><div id="families" class="flow-sources"></div></fieldset>
<div class="form-grid"><label class="field">资料角色<select id="role"><option value="">全部角色</option><option value="normative">规范性条款</option><option value="guidance">说明性指导</option><option value="change_log">变更记录</option><option value="local_policy">当前本地规则</option></select></label><label class="field">检索条数<select id="top-k"><option>3</option><option selected>4</option><option>6</option><option>8</option></select></label></div>
<div class="actions"><button id="retrieve" class="secondary-button">只检索证据</button><button id="ask" class="primary-button">检索并调用模型</button></div><p class="flow-meta">“只检索”不调用模型。“检索并调用模型”将问题与选中资料发给DeepSeek，并使用本机已配置额度。每次是独立对话，不附带聊天历史。</p><div id="progress" class="flow-progress" aria-live="polite"></div>
<h3>可回查的问答记录</h3><label class="field">选择记录<select id="history"></select></label><div class="actions"><button id="reanswer" class="secondary-button" disabled>按当前依据重新回答</button><button id="download" class="text-button" disabled>导出这条问答JSON</button></div><p class="flow-meta">重新回答会产生新的付费请求，保留旧回答。只有引用了被更新本地规则的回答才会因该次发布被标记待复核。</p></section>
<section class="panel"><h2>原始回答与证据</h2><div id="answer"><p class="flow-meta">先检索或发起问答。</p></div><div id="hits"></div></section></div></main></body></html>
